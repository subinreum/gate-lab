<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>文本差异对比器</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; padding: 24px; }
  h1 { font-size: 18px; margin: 0 0 16px; }
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  textarea { width: 100%; height: 180px; box-sizing: border-box; padding: 8px; }
  button { margin: 12px 0; padding: 8px 16px; }
  #summary { margin: 8px 0 16px; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 2px 8px; vertical-align: top; white-space: pre-wrap; }
  td.mark { width: 2em; text-align: center; user-select: none; }
  tr[data-type="add"] { background: rgba(0, 160, 0, 0.15); }
  tr[data-type="del"] { background: rgba(200, 0, 0, 0.15); }
</style>
</head>
<body>
<h1>文本差异对比器</h1>
<div class="panes">
  <textarea id="left" aria-label="left" placeholder="原文"></textarea>
  <textarea id="right" aria-label="right" placeholder="新文"></textarea>
</div>
<button id="run" type="button">对比</button>
<p id="summary" data-equal="" data-add="" data-del="">尚未对比</p>
<table><tbody id="result"></tbody></table>
<script type="module" src="./src/app.mjs"></script>
</body>
</html>
