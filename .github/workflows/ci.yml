name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  engine:
    name: 引擎闸门
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: 跑引擎闸门
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out
          node scripts/gate-engine.mjs out | tee out/stdout-engine.log
          exit "${PIPESTATUS[0]}"
      - name: 上传引擎报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-engine
          path: out/
          if-no-files-found: error

  browser:
    name: 页面闸门
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: 装 Playwright（版本从 package.json 读，不写死在这里）
        shell: bash
        run: |
          set -euo pipefail
          PIN="$(node -p 'require("./package.json").devDependencies.playwright')"
          echo "pinned playwright: $PIN"
          npm install --no-save "playwright@$PIN"
          npx playwright install --with-deps chromium
      - name: 跑页面闸门
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out
          node scripts/gate-browser.mjs out | tee out/stdout-browser.log
          exit "${PIPESTATUS[0]}"
      - name: 上传页面报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-browser
          path: out/
          if-no-files-found: error

  report:
    name: 回报结果
    needs: [engine, browser]
    if: always()
    permissions:
      contents: write
      pull-requests: write
    uses: subinreum/ci-workflows/.github/workflows/report.yml@main
    with:
      node-version: '22'
      gates: '[{"name":"引擎闸门","result":"${{ needs.engine.result }}"},{"name":"页面闸门","result":"${{ needs.browser.result }}"}]'
      composer-files: scripts/compose-report.mjs
      composer-entry: scripts/compose-report.mjs
      marker: '<!-- gate-lab-report -->'

  attest:
    name: 送达核对
    needs:
      - engine
      - browser
      - report
    if: always()
    permissions:
      contents: read
      pull-requests: read
    uses: subinreum/ci-workflows/.github/workflows/attest.yml@main
    with:
      marker: '<!-- gate-lab-report -->'
      gates: '[{"name":"引擎闸门","result":"${{ needs.engine.result }}"},{"name":"页面闸门","result":"${{ needs.browser.result }}"}]'
      report-result: ${{ needs.report.result }}
