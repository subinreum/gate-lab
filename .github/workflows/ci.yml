name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  engine:
    name: 引擎闸门
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: 跑引擎闸门
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out
          node scripts/gate-engine.mjs out | tee out/stdout-engine.log
          exit "${PIPESTATUS[0]}"
      - name: 上传引擎报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-engine
          path: out/
          if-no-files-found: error

  browser:
    name: 页面闸门
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: 装 Playwright（版本从 package.json 读，不写死在这里）
        shell: bash
        run: |
          set -euo pipefail
          PIN="$(node -p 'require("./package.json").devDependencies.playwright')"
          echo "pinned playwright: $PIN"
          npm install --no-save "playwright@$PIN"
          npx playwright install --with-deps chromium
      - name: 跑页面闸门
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out
          node scripts/gate-browser.mjs out | tee out/stdout-browser.log
          exit "${PIPESTATUS[0]}"
      - name: 上传页面报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-browser
          path: out/
          if-no-files-found: error

  # 变异体：回写 job 整个删掉。真的一个字都没写出去。
  # 闸门仍然全绿，所以这一跑在面板上看起来应该是健康的, 除非送达核对真的在守。
  attest:
    name: 送达核对
    needs:
      - engine
      - browser
    if: always()
    permissions:
      contents: read
      pull-requests: read
    uses: subinreum/ci-workflows/.github/workflows/attest.yml@main
    with:
      marker: '<!-- gate-lab-report -->'
      gates: '[{"name":"引擎闸门","result":"${{ needs.engine.result }}"},{"name":"页面闸门","result":"${{ needs.browser.result }}"}]'
      report-result: skipped
      poll-timeout-seconds: 20
      poll-interval-seconds: 4
